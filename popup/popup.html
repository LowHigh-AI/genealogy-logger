<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="popup.css">
  <title>Genealogy Logger</title>
</head>
<body>
  <div class="header">
    <div class="logo">Genealogy Logger</div>
    <div class="header-actions">
      <div class="badge" id="status-badge">Loading…</div>
      <button type="button" class="icon-btn" id="settings-btn" title="Settings">⚙</button>
    </div>
  </div>

  <div class="content">
    <div class="family-line-row">
      <label for="family-line-select" class="label">Log to</label>
      <select id="family-line-select">
        <option value="">General</option>
      </select>
      <button type="button" class="setup-link hidden" id="add-lines-link">Add family lines →</button>
    </div>

    <div class="preview-card">
      <div class="label">Source</div>
      <div class="value truncate" id="url-preview">–</div>

      <div class="label">Document image</div>
      <div class="value" id="media-preview">Scanning…</div>

      <div class="label">Page text</div>
      <div class="value" id="text-preview">Scanning…</div>

      <div class="label"><label for="notes-input">Notes (optional)</label></div>
      <textarea id="notes-input" class="notes-input" placeholder="Anything you want recorded with this entry…"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="send-log-btn" class="btn btn-primary" disabled>Send to Log</button>
    <button id="retry-btn" class="btn btn-secondary hidden">Retry</button>
    <button id="copy-gemini-btn" class="btn btn-secondary" disabled>Copy for Gemini</button>
  </div>

  <div id="queue-note" class="queue-note hidden"></div>
  <div id="message-area" class="message hidden"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
